[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
buildArgs = [
  "NEXT_PUBLIC_STELLAR_NETWORK=${{NEXT_PUBLIC_STELLAR_NETWORK}}",
  "NEXT_PUBLIC_STELLAR_NETWORK_PASSPHRASE=${{NEXT_PUBLIC_STELLAR_NETWORK_PASSPHRASE}}",
  "NEXT_PUBLIC_STELLAR_RPC_URL=${{NEXT_PUBLIC_STELLAR_RPC_URL}}",
  "NEXT_PUBLIC_TOKEN_WASM_HASH=${{NEXT_PUBLIC_TOKEN_WASM_HASH}}",
  "NEXT_PUBLIC_TOKEN_CONTRACT_ID=${{NEXT_PUBLIC_TOKEN_CONTRACT_ID}}",
  "NEXT_PUBLIC_FACTORY_CONTRACT_ID=${{NEXT_PUBLIC_FACTORY_CONTRACT_ID}}",
  "NEXT_PUBLIC_BONDING_CURVE_CONTRACT_ID=${{NEXT_PUBLIC_BONDING_CURVE_CONTRACT_ID}}"
]

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
