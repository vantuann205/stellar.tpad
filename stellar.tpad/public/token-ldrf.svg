<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Lumen Drift token">
  <defs>
    <linearGradient id="ldrfBg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="48%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="ldrfOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#ecfeff" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#a5f3fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ldrfTrail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".9"/>
    </linearGradient>
  </defs>

  <circle cx="128" cy="128" r="128" fill="url(#ldrfBg)"/>
  <circle cx="128" cy="128" r="118" fill="none" stroke="#ffffff" stroke-opacity=".2" stroke-width="2"/>

  <!-- Drift: an orbit tilted off-axis, a light travelling along it, and the
       trail it leaves. Deliberately off-centre and asymmetric, so it reads as
       motion where the TPAD mark reads as a fixed point. -->
  <ellipse cx="128" cy="132" rx="88" ry="42" fill="none"
           stroke="#ffffff" stroke-opacity=".26" stroke-width="2.5"
           transform="rotate(-28 128 132)"/>

  <path d="M56 158 C78 176 118 178 158 154" fill="none"
        stroke="url(#ldrfTrail)" stroke-width="7" stroke-linecap="round"/>

  <circle cx="168" cy="147" r="26" fill="url(#ldrfOrb)"/>
  <circle cx="168" cy="147" r="11" fill="#ffffff"/>

  <circle cx="80" cy="86" r="4.5" fill="#ffffff" fill-opacity=".62"/>
  <circle cx="196" cy="82" r="3" fill="#ffffff" fill-opacity=".46"/>
  <circle cx="106" cy="196" r="2.6" fill="#ffffff" fill-opacity=".4"/>
</svg>
