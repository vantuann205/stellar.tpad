<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Stellar TPad token">
  <defs>
    <linearGradient id="tpadBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="52%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="tpadGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".32"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="128" cy="128" r="128" fill="url(#tpadBg)"/>
  <circle cx="128" cy="128" r="128" fill="url(#tpadGlow)"/>
  <circle cx="128" cy="128" r="118" fill="none" stroke="#ffffff" stroke-opacity=".24" stroke-width="2"/>

  <!-- Launch spark, centred and symmetrical: this is the platform's own token,
       so the mark is the plainest statement of the brand. -->
  <path d="M128 42 C136 96 160 120 214 128 C160 136 136 160 128 214 C120 160 96 136 42 128 C96 120 120 96 128 42 Z"
        fill="#ffffff" fill-opacity=".95"/>

  <circle cx="186" cy="72" r="7" fill="#ffffff" fill-opacity=".72"/>
  <circle cx="70" cy="180" r="5" fill="#ffffff" fill-opacity=".52"/>
  <circle cx="196" cy="188" r="3.5" fill="#ffffff" fill-opacity=".44"/>
  <circle cx="62" cy="88" r="3" fill="#ffffff" fill-opacity=".38"/>
</svg>
